name: Build fog kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4
        with:
          path: build-repo

      - name: Clone base kernel
        run: |
          git clone --depth 1 --branch fog-ksu \
            https://github.com/alternoegraha/kernel_xiaomi_sm6225 kernel
          cd kernel
          git log --oneline -1

      - name: Apply patches
        run: |
          cd kernel
          for p in ../build-repo/patches/0*.patch; do
            echo "==> Applying $(basename $p)"
            git apply --check "$p" && git apply "$p"
          done
          echo "All patches applied."

      - name: Set up ReSukiSU (manual hooks, no SuSFS)
        run: |
          cd kernel
          bash ../build-repo/scripts/setup-resukisu.sh

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex cpio libssl-dev libelf-dev

      - name: Download toolchains
        run: |
          mkdir -p toolchain && cd toolchain
          echo "==> WeebX-Clang 19.1.5"
          curl -L -o weebx.tar.gz \
            https://github.com/XSans0/WeebX-Clang/releases/download/WeebX-Clang-19.1.5-release/WeebX-Clang-19.1.5.tar.gz
          mkdir -p weebx && tar xzf weebx.tar.gz -C weebx
          echo "==> LineageOS GCC 4.9 (arm64)"
          git clone --depth 1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
          echo "==> LineageOS GCC 4.9 (arm32)"
          git clone --depth 1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32
          ls weebx/bin/clang gcc64/bin/aarch64-linux-android-gcc gcc32/bin/arm-linux-androideabi-gcc

      - name: Configure
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/toolchain/weebx/bin:$GITHUB_WORKSPACE/toolchain/gcc64/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$PATH"
          export ARCH=arm64
          export LLVM=1
          export CLANG_TRIPLE=aarch64-linux-android-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          make vendor/fog-perf_defconfig
          make olddefconfig
          echo "=== KSU config check ==="
          grep -E "^CONFIG_KSU=|^CONFIG_KSU_MANUAL_HOOK=" .config
          test "$(grep -c '^CONFIG_KSU_MANUAL_HOOK=y' .config)" = "1"
          grep -E "^CONFIG_UKSM=|^CONFIG_KSM=|^CONFIG_ZRAM_DEF_COMP=|^CONFIG_DEFAULT_TCP_CONG=" .config

      - name: Build kernel
        shell: bash
        run: |
          set -o pipefail
          cd kernel
          export PATH="$GITHUB_WORKSPACE/toolchain/weebx/bin:$GITHUB_WORKSPACE/toolchain/gcc64/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$PATH"
          export ARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-android-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          # Match proven local builds: CC=clang on command line (no LLVM=1,
          # which switches to ld.lld and failed at vmlinux link in run #4)
          build_args=(
            ARCH="$ARCH"
            CLANG_TRIPLE="$CLANG_TRIPLE"
            CROSS_COMPILE="$CROSS_COMPILE"
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32"
            CC=clang
          )
          echo "Using compiler: $(command -v clang)"
          clang --version | head -2
          make "${build_args[@]}" -j"$(nproc)" Image.gz \
            > ../build-first.log 2>&1 || {
              echo "Parallel build failed; retrying serially..."
              tail -100 ../build-first.log
              make V=1 "${build_args[@]}" -j1 Image.gz \
                > ../build-second.log 2>&1
            }
          test -s arch/arm64/boot/Image.gz
          ls -lh arch/arm64/boot/Image.gz

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          if-no-files-found: ignore
          path: |
            build-first.log
            build-second.log
            kernel/.config

      - name: Package flashable zip
        run: |
          cp kernel/arch/arm64/boot/Image.gz build-repo/anykernel/Image.gz
          cd build-repo/anykernel
          zip -r9 ../Fog-kernel-$(date +%Y%m%d).zip .
          ls -lh ../*.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fog-kernel
          path: |
            build-repo/Fog-kernel-*.zip
            kernel/arch/arm64/boot/Image.gz
